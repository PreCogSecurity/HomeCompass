name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only ever needs to read the repository.
permissions:
  contents: read

# Every action below is pinned to an immutable commit SHA, with the human
# readable version kept in a trailing comment. A floating tag such as
# `actions/checkout@v4` can be repointed by whoever controls that tag, which
# turns a routine CI dependency into remote code execution inside this
# repository; Dependabot (see .github/dependabot.yml) refreshes the SHAs.

# A new push to the same ref supersedes the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and test (Node ${{ matrix.node-version }})
    # Pinned runner image. `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19,
    # and an unannounced base-image flip is exactly the kind of fragility that
    # breaks a release build the day before a ship.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19', '22.x', '24.x']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing downstream needs the token, so do not leave a credential in
          # `.git/config` for the rest of the job to pick up.
          persist-credentials: false

      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` (not `npm install`) so CI can never silently resolve a
      # different dependency graph than the committed lockfile. `--ignore-scripts`
      # denies every dependency's lifecycle hooks: a package must never be able
      # to execute code during install just by being in the tree.
      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  security:
    name: CodeQL static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # CodeQL needs to upload its SARIF results; nothing else is granted.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Independent SAST pass: catches tainted data reaching a sink in code the
      # hand-written linter does not model. JavaScript analysis needs no build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3

  container:
    name: Container image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag homecompass:ci .

      - name: Smoke test the container
        run: |
          docker run --detach --name homecompass-ci --publish 127.0.0.1:8080:8080 homecompass:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              docker rm --force homecompass-ci
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy" >&2
          docker logs homecompass-ci
          docker rm --force homecompass-ci
          exit 1
