version: 2

updates:
  # Keeps the pinned Node runtime and the zero-dependency tree honest.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    commit-message:
      prefix: 'chore(deps)'

  # The workflow itself is attack surface: it runs with repository privileges.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
